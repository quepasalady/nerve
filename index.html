
<style>
*{box-sizing:border-box;margin:0;padding:0;}
#app{width:100%;max-width:400px;margin:0 auto;padding:1.5rem 1rem 2rem;font-family:Georgia,serif;text-align:center;}
.eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#bbb;margin-bottom:6px;}
.title{font-size:26px;font-weight:400;color:var(--color-text-primary);margin-bottom:4px;}
.sub{font-size:12px;color:#bbb;margin-bottom:24px;}
.win{background:#d5f5e3;border:1.5px solid #27ae60;border-radius:16px;padding:12px 16px;margin-bottom:16px;font-size:13px;color:#1a7a42;display:none;}
.input-wrap{position:relative;margin-bottom:8px;}
input[type=text]{width:100%;border:1.5px solid #ddd;border-radius:50px;padding:13px 20px;font-size:16px;font-family:Georgia,serif;outline:none;background:#fff;color:var(--color-text-primary);text-align:center;-webkit-appearance:none;}
input[type=text]:focus{border-color:#888;}
input::placeholder{color:#ccc;}
.row-btns{display:flex;gap:8px;margin-bottom:6px;}
.btn-submit{flex:1;border:none;background:#1a1a1a;color:#fff;padding:13px;font-size:15px;font-family:Georgia,serif;cursor:pointer;border-radius:50px;letter-spacing:.03em;}
.btn-submit:active{background:#333;}
.btn-new{border:1.5px solid #ddd;background:#fff;color:#999;padding:13px 18px;font-size:13px;font-family:Georgia,serif;cursor:pointer;border-radius:50px;}
.btn-new:active{background:#f5f5f5;}
.sug-box{border:1.5px solid #eee;border-radius:16px;background:#fff;position:absolute;z-index:10;width:100%;top:calc(100% + 6px);overflow:hidden;}
.sug-item{padding:13px 20px;font-size:15px;cursor:pointer;color:var(--color-text-primary);font-family:Georgia,serif;text-align:left;border-bottom:0.5px solid #f5f5f5;}
.sug-item:last-child{border-bottom:none;}
.sug-item:active{background:#f5f5f5;}
.err{font-size:12px;color:#e74c3c;min-height:18px;margin-bottom:10px;}
.legend{display:flex;gap:16px;justify-content:center;margin-bottom:20px;flex-wrap:wrap;}
.leg{display:flex;align-items:center;gap:6px;font-size:12px;color:#888;}
.dot{width:10px;height:10px;border-radius:50%;}
.dg{background:#27ae60;}.do{background:#e67e22;}.dr{background:#e74c3c;}
.attempts{font-size:12px;color:#ccc;margin-bottom:12px;letter-spacing:.03em;}
.guess-list{display:flex;flex-direction:column;gap:10px;}
.gcard{border:1.5px solid #eee;border-radius:16px;overflow:hidden;text-align:left;}
.gcard-header{background:#f9f9f9;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;}
.gcard-name{font-size:15px;font-weight:500;color:var(--color-text-primary);}
.gcard-num{font-size:11px;color:#bbb;letter-spacing:.05em;}
.gcard-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#eee;}
.gcell{padding:10px 12px;background:#fff;}
.gcell.green{background:#d5f5e3;}
.gcell.orange{background:#fdebd0;}
.gcell.red{background:#fadbd8;}
.gcell-label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px;}
.gcell.green .gcell-label{color:#1a7a42;}
.gcell.orange .gcell-label{color:#9a5a0a;}
.gcell.red .gcell-label{color:#a93226;}
.gcell-val{font-size:12px;line-height:1.35;}
.gcell.green .gcell-val{color:#1a7a42;}
.gcell.orange .gcell-val{color:#9a5a0a;}
.gcell.red .gcell-val{color:#a93226;}
.gcard-badge{font-size:10px;padding:3px 10px;border-radius:50px;font-family:Georgia,serif;}
.badge-green{background:#27ae60;color:#fff;}
.badge-wrong{background:#eee;color:#bbb;}
</style>

<div id="app">
  <p class="eyebrow">Neuroanatomie</p>
  <h1 class="title">Cranial Nerves</h1>
  <p class="sub">Devinez le nerf cible</p>
  <div id="win" class="win"></div>
  <div class="input-wrap" id="iwrap">
    <input type="text" id="ginput" placeholder="ex : facial" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="text"/>
    <div class="sug-box" id="sug" style="display:none;"></div>
  </div>
  <div class="row-btns">
    <button class="btn-submit" id="sbtn">Valider</button>
    <button class="btn-new" id="nbtn">Nouveau</button>
  </div>
  <div class="err" id="err"></div>
  <div class="legend">
    <span class="leg"><span class="dot dg"></span>Exact</span>
    <span class="leg"><span class="dot do"></span>Partiel</span>
    <span class="leg"><span class="dot dr"></span>Incorrect</span>
  </div>
  <div id="att" class="attempts"></div>
  <div id="list" class="guess-list"></div>
</div>

<script>
const DATA=[
  {number:"I",name:"OLFACTORY",type:["Sensory"],fibers:["SVA"],brain_part:"TELENCEPHALON",foramen_canal:["Cribriform plate"]},
  {number:"II",name:"OPTIC",type:["Sensory"],fibers:["SSA"],brain_part:"DIENCEPHALON",foramen_canal:["Optic canal"]},
  {number:"III",name:"OCULOMOTOR",type:["Motor","Parasympathetic"],fibers:["GSE","GVE"],brain_part:"MIDBRAIN",foramen_canal:["Superior orbital fissure"]},
  {number:"IV",name:"TROCHLEAR",type:["Motor"],fibers:["GSE"],brain_part:"MIDBRAIN",foramen_canal:["Superior orbital fissure"]},
  {number:"V",name:"TRIGEMINAL",type:["Sensory","Motor"],fibers:["GSA","SVE"],brain_part:"PONS",foramen_canal:["V1: Superior orbital fissure","V2: Foramen rotundum","V3: Foramen ovale"]},
  {number:"VI",name:"ABDUCENS",type:["Motor"],fibers:["GSE"],brain_part:"PONS",foramen_canal:["Superior orbital fissure"]},
  {number:"VII",name:"FACIAL",type:["Sensory","Motor","Parasympathetic"],fibers:["GSA","SVA","GVA","SVE","GVE"],brain_part:"PONTOMEDULLARY JUNCTION",foramen_canal:["Internal acoustic meatus"]},
  {number:"VIII",name:"VESTIBULOCOCHLEAR",type:["Sensory"],fibers:["SSA"],brain_part:"PONTOMEDULLARY JUNCTION",foramen_canal:["Internal acoustic meatus"]},
  {number:"IX",name:"GLOSSOPHARYNGEAL",type:["Sensory","Motor","Parasympathetic"],fibers:["GSA","GVA","SVA","SVE","GVE"],brain_part:"MEDULLA OBLONGATA",foramen_canal:["Jugular foramen"]},
  {number:"X",name:"VAGUS",type:["Sensory","Motor","Parasympathetic"],fibers:["GSA","GVA","SVA","SVE","GVE"],brain_part:"MEDULLA OBLONGATA",foramen_canal:["Jugular foramen"]},
  {number:"XI",name:"ACCESSORY",type:["Motor"],fibers:["GSE","SVE","ASG"],brain_part:"MEDULLA OBLONGATA",foramen_canal:["Jugular foramen"]},
  {number:"XII",name:"HYPOGLOSSAL",type:["Motor"],fibers:["GSE","AVG"],brain_part:"MEDULLA OBLONGATA",foramen_canal:["Hypoglossal canal"]}
];

let target=null,guesses=[],won=false;
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1).toLowerCase();
const norm=s=>s.trim().toUpperCase();
const findNerve=v=>{const n=norm(v);return DATA.find(d=>norm(d.name)===n)||DATA.find(d=>norm(d.name).startsWith(n))||DATA.find(d=>n===d.number);};

function cmpSet(g,t){
  const gs=new Set(g.map(x=>x.toUpperCase())),ts=new Set(t.map(x=>x.toUpperCase()));
  const i=[...gs].filter(x=>ts.has(x));
  if(i.length===ts.size&&gs.size===ts.size)return'green';
  if(i.length>0)return'orange';
  return'red';
}
function cmpFor(g,t){
  const gn=g.map(x=>x.toUpperCase()),tn=t.map(x=>x.toUpperCase());
  if(JSON.stringify([...gn].sort())===JSON.stringify([...tn].sort()))return'green';
  const gw=new Set(gn.join(' ').split(/\s+/)),tw=new Set(tn.join(' ').split(/\s+/));
  return[...gw].filter(w=>w.length>3&&tw.has(w)).length>0?'orange':'red';
}
function cmp(g,t){
  return{
    name:norm(g.name)===norm(t.name)?'green':'red',
    type:cmpSet(g.type,t.type),
    fibers:cmpSet(g.fibers,t.fibers),
    brain:norm(g.brain_part)===norm(t.brain_part)?'green':'red',
    foramen:cmpFor(g.foramen_canal,t.foramen_canal)
  };
}

function renderList(){
  const el=document.getElementById('list');
  if(!guesses.length){el.innerHTML='';return;}
  el.innerHTML=guesses.map((g,i)=>{
    const r=cmp(g,target);
    const isWin=r.name==='green'&&r.type==='green'&&r.fibers==='green'&&r.brain==='green'&&r.foramen==='green';
    return`<div class="gcard">
      <div class="gcard-header">
        <div><span class="gcard-name">${cap(g.name)}</span><span class="gcard-num"> — CN ${g.number}</span></div>
        <span class="gcard-badge ${isWin?'badge-green':'badge-wrong'}">${isWin?'Correct':'#'+(guesses.length-i)}</span>
      </div>
      <div class="gcard-grid">
        <div class="gcell ${r.type}"><div class="gcell-label">Type</div><div class="gcell-val">${g.type.join(', ')}</div></div>
        <div class="gcell ${r.fibers}"><div class="gcell-label">Fibres</div><div class="gcell-val">${g.fibers.join(', ')}</div></div>
        <div class="gcell ${r.brain}"><div class="gcell-label">Région</div><div class="gcell-val">${cap(g.brain_part)}</div></div>
        <div class="gcell ${r.foramen}"><div class="gcell-label">Foramen</div><div class="gcell-val">${g.foramen_canal.join(' · ')}</div></div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('att').textContent=`${guesses.length} tentative${guesses.length>1?'s':''}`;
}

function showWin(){
  const b=document.getElementById('win');
  b.style.display='block';
  b.innerHTML=`Bravo ! CN ${target.number} — ${cap(target.name)} en ${guesses.length} tentative${guesses.length>1?'s':''}.`;
  document.getElementById('ginput').disabled=true;
  document.getElementById('sbtn').disabled=true;
}

function submitNerve(nerveName){
  if(won)return;
  const nerve=findNerve(nerveName);
  if(!nerve){document.getElementById('err').textContent='Nerf non reconnu.';return;}
  if(guesses.find(g=>g.name===nerve.name)){document.getElementById('err').textContent='Déjà proposé.';return;}
  document.getElementById('err').textContent='';
  guesses.unshift(nerve);
  renderList();
  document.getElementById('ginput').value='';
  document.getElementById('sug').style.display='none';
  if(nerve.name===target.name){won=true;showWin();}
}

function submit(){
  submitNerve(document.getElementById('ginput').value.trim());
}

function newGame(){
  target=DATA[Math.floor(Math.random()*DATA.length)];
  guesses=[];won=false;
  document.getElementById('win').style.display='none';
  document.getElementById('ginput').value='';
  document.getElementById('ginput').disabled=false;
  document.getElementById('sbtn').disabled=false;
  document.getElementById('err').textContent='';
  document.getElementById('att').textContent='';
  document.getElementById('list').innerHTML='';
  document.getElementById('sug').style.display='none';
  document.getElementById('ginput').focus();
}

function updateSuggestions(){
  const v=norm(document.getElementById('ginput').value.trim());
  const sug=document.getElementById('sug');
  if(!v){sug.style.display='none';return;}
  const m=DATA.filter(d=>d.name.startsWith(v)||d.name.includes(v));
  if(!m.length){sug.style.display='none';return;}
  sug.innerHTML=m.map(x=>`<div class="sug-item" data-n="${x.name}">${cap(x.name)}</div>`).join('');
  sug.style.display='block';
  sug.querySelectorAll('.sug-item').forEach(el=>{
    el.addEventListener('mousedown',e=>{
      e.preventDefault();
      const name=e.currentTarget.dataset.n;
      sug.style.display='none';
      document.getElementById('ginput').value='';
      submitNerve(name);
    });
    el.addEventListener('touchstart',e=>{
      e.preventDefault();
      const name=e.currentTarget.dataset.n;
      sug.style.display='none';
      document.getElementById('ginput').value='';
      submitNerve(name);
    },{passive:false});
  });
}

const inp=document.getElementById('ginput');
inp.addEventListener('input',updateSuggestions);
inp.addEventListener('keydown',e=>{
  if(e.key==='Enter'){document.getElementById('sug').style.display='none';submit();}
  if(e.key==='Escape')document.getElementById('sug').style.display='none';
});
document.addEventListener('click',e=>{if(!e.target.closest('#iwrap'))document.getElementById('sug').style.display='none';});
document.getElementById('sbtn').addEventListener('click',submit);
document.getElementById('nbtn').addEventListener('click',newGame);
newGame();
</script>
